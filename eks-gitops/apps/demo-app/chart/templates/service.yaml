{{- $name := printf "demo-%s" .Values.service }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
spec:
  type: ClusterIP
  selector:
    app: {{ $name }}
  ports:
    - name: http
      port: 80
      targetPort: {{ .Values.port }} # 포트 표준: http 80 → 3001
{{- if and .Values.rollout.enabled .Values.ingress.enabled }}
---
# canary 서비스 (ALB 가중치 모드 전용) — Rollouts 컨트롤러가 selector 에 pod-template-hash 를 붙여 canary 파드만 태움
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-canary
  labels:
    app: {{ $name }}
spec:
  type: ClusterIP
  selector:
    app: {{ $name }}
  ports:
    - name: http
      port: 80
      targetPort: {{ .Values.port }}
{{- end }}
