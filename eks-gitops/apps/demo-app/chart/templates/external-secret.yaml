{{- if and .Values.secret.enabled .Values.secret.manage }}
# SM {{ .Values.secret.smKey }} → k8s Secret {{ .Values.secret.name }} (이름 env 무관 통일 — envFrom 이 그대로 참조)
apiVersion: external-secrets.io/v1 # ESO 2.x (green) — v1beta1 미지원
kind: ExternalSecret
metadata:
  name: {{ .Values.secret.name }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: {{ .Values.secret.name }}
    creationPolicy: Owner
  # 전용 시크릿(키 이름 = env 이름 그대로)이라 전체 extract
  dataFrom:
    - extract:
        key: {{ required "secret.manage 시 smKey 필수" .Values.secret.smKey }}
{{- end }}
