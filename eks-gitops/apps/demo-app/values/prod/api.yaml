# prod/api — 골든 차트(../../chart) 대비 차이만
service: api

image:
  repository: 111111111111.dkr.ecr.ap-northeast-2.amazonaws.com/demo-api-ecr-prod
  tag: init # ⚠️ prod ECR 빈 상태 — 첫 prod CI 실행 전까지 ImagePullBackOff 정상. CI 가 수정

nodeEnv: prod

# replicas 는 HPA 소유라 미기재 — min 이 사실상 상시 대수 (이 밑으론 안 내려감)
hpa:
  enabled: true
  min: 2 # PDB 와 세트 (2026-10-09) — min 1 이면 PDB 가 drain 데드락, 2 라야 1개 유지하며 1개 evict
  max: 4
  cpu: 70

# 노드 drain(spot 교체·AMI 업그레이드·consolidation) 중에도 최소 1개 유지.
# minAvailable 1 로 느슨하게 — 빡세면(maxUnavailable 작게) consolidation 이 파드 evict 못 해 노드 회수 막힘.
pdb:
  enabled: true
  minAvailable: 1

# KEDA — api 는 ALB 뒤가 아님(web 이 http://demo-api 로 내부 프록시) → request count 트리거 불가.
# CPU baseline 만으로 쓰려면 hpa 로 충분. keda 는 SQS 워커 도입 or Prometheus RPS 계측 때 발동:
# keda: {enabled: true, sqs: {enabled: true, queueURL: ...}}

probes:
  path: /api/health

secret:
  manage: true
  smKey: demo-app-sec-prod

extraVolumes:
  - name: uploads
    emptyDir: {}
extraVolumeMounts:
  - name: uploads
    mountPath: /app/uploads
