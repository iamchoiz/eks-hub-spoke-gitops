# SM demo/platform/hub → k8s Secret argocd-github-sso (argocd ns).
# values.yaml 의 dex.config 가 $argocd-github-sso:client_id / :client_secret 로 참조.
# part-of: argocd 라벨 = ArgoCD 가 $시크릿 참조를 허용하는 조건.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-github-sso
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: argocd-github-sso
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
  data:
    - secretKey: client_id
      remoteRef:
        key: demo/platform/hub
        property: argocd_client_id
        conversionStrategy: Default	
        decodingStrategy: None      
        metadataPolicy: None
    - secretKey: client_secret
      remoteRef:
        key: demo/platform/hub
        property: argocd_client_secret
        conversionStrategy: Default	
        decodingStrategy: None      
        metadataPolicy: None
