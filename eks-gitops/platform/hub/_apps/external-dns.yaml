apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: hub
  source:
    repoURL: https://kubernetes-sigs.github.io/external-dns/
    chart: external-dns
    targetRevision: 1.15.2 # verify at sync
    helm:
      valuesObject:
        provider:
          name: aws
        policy: upsert-only # 삭제 안 함 (안전)
        domainFilters:
          - eks.example.com # 전용 서브도메인만
        txtOwnerId: demo-hub-01
        sources:
          - ingress
          - service
        serviceAccount:
          name: external-dns # Pod Identity association 이 이 SA 에
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
