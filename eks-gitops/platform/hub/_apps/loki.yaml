apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki # release 이름 — SA·리소스명(loki-gateway 등) 파생원, Pod Identity association 과 일치
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2" # storageclass(0)·ALB Controller 뒤 — PVC(gp3) + gateway NLB 생성 위해
spec:
  project: hub
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: 6.55.0 # app v3.6.7 — 최신(7.3.x/3.6.12)에서 뒤 (업그레이드 연습용, 6.x 라인 안정)
      helm:
        valueFiles:
          - $values/platform/hub/loki/values.yaml
    - repoURL: git@github.com:your-org/eks-hub-spoke-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring # 관측 허브 집중 (thanos·grafana 와 동거)
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    automated:
      selfHeal: true
      prune: true
  # thanos 와 동일: StatefulSet volumeClaimTemplates 의 apiVersion/kind 를 API 서버가 정규화로 제거 → 영구 diff
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - '.spec.volumeClaimTemplates[]?.apiVersion'
        - '.spec.volumeClaimTemplates[]?.kind'
