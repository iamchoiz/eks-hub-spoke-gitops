apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1" # CRD 포함
spec:
  project: hub
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.11.0 # verify at sync
    helm:
      valuesObject:
        installCRDs: true
        serviceAccount:
          name: external-secrets # Pod Identity association 이 이 SA 에 붙음 (annotation 불필요)
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      selfHeal: true
      prune: true
