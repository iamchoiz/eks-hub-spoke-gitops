apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2
      # auth 블록 없음 = ESO 컨트롤러 파드의 Pod Identity 사용 (aws-ssm store 와 동일).
      # IAM: demo-hub-01-external-secrets role 이 secret:demo/* 에 GetSecretValue 가능.
