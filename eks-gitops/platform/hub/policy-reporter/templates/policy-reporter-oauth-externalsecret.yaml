# SM demo/platform/hub → k8s Secret policy-reporter-oauth (monitoring ns) — policy-reporter UI GitHub SSO.
# ui.oauth.secretRef 가 clientId/clientSecret 키를 읽음. 이 폴더는 Application 의 세 번째 source(directory).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: policy-reporter-oauth
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: policy-reporter-oauth
  # remoteRef 기본값 3종 명시 = 우리 컨벤션 (SSA 앱 영구 OutOfSync 방지)
  data:
    - secretKey: clientId
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: demo/platform/hub
        property: policyreporter_client_id
    - secretKey: clientSecret
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: demo/platform/hub
        property: policyreporter_client_secret
