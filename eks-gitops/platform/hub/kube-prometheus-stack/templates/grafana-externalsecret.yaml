# SM demo/platform/hub → k8s Secret grafana-secrets (monitoring ns) — Grafana 관련 전부 (SSO + admin 비번).
# 소비 2곳: ① envFromSecret 이 통째 env 주입 → GF_AUTH_GITHUB_* 만 유효한 env 이름이라 주입됨
#           (admin-user/admin-password 는 대시 때문에 env 무효 → kubelet 이 스킵 = env 노출 없음)
#         ② admin.existingSecret 이 admin-user/admin-password 키만 집어감
# ArgoCD 키는 여기 안 섞음 — envFrom 에 타 서비스 시크릿 노출 방지 (client_id 류는 유효 env 이름이라 위험)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-secrets
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: grafana-secrets
  data:
    - secretKey: GF_AUTH_GITHUB_CLIENT_ID
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: demo/platform/hub
        property: grafana_client_id
    - secretKey: GF_AUTH_GITHUB_CLIENT_SECRET
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: demo/platform/hub
        property: grafana_client_secret
    - secretKey: admin-user
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: demo/platform/hub
        property: grafana_admin_user
    - secretKey: admin-password
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: demo/platform/hub
        property: grafana_admin_password
