# 배선 전용 — 설정 본문은 alertmanager-config-template.yaml(ConfigMap) 에서 수정한다.
# SM demo/platform/hub 의 slack_webhook_url·slack_channel 을 ConfigMap 템플릿에 주입해
# Secret alertmanager-config(키: alertmanager.yaml) 생성 → kps alertmanagerSpec.configSecret 이 사용.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-config
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: alertmanager-config
    creationPolicy: Owner # ↓ 4필드 = ESO 서버 주입 기본값 명시 (SSA 영구 OutOfSync 족보 — grafana ES 컨벤션과 동일)
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      templateFrom:
        - target: Data
          configMap:
            name: alertmanager-config-template
            items:
              - key: alertmanager.yaml # 렌더 결과가 같은 키로 Secret 에 들어감
                templateAs: Values # ⚠️ 지우지 말 것 — ESO 서버 주입 기본값. git 에서 빼면 영구 OutOfSync (SSA 족보)
  data:
    - secretKey: slack_webhook_url
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: demo/platform/hub
        property: slack_webhook_url
    - secretKey: slack_channel
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: demo/platform/hub
        property: slack_channel
