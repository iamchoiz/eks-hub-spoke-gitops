# E1 — Grafana Alloy (허브 로그 수집 DaemonSet) → 같은 클러스터의 Loki 로 직접 (NLB 불필요).
# 스포크 alloy appset 과 동일 설계 — 차이: Loki 주소(in-cluster svc), cluster 라벨(demo-hub-01).
# 허브 플랫폼 컴포넌트(ArgoCD·Thanos·ESO·Loki 자신...) 로그가 전부 수집 대상.
controller:
  type: daemonset
  # 전 노드 수집 — 시스템 NG(CriticalAddonsOnly taint) 포함 전체 tolerate
  tolerations:
    - operator: Exists

alloy:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }
  extraEnv:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
  configMap:
    content: |
      // 자기 노드의 파드만 발견 (DaemonSet 1대당 1노드 담당)
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("NODE_NAME")
        }
      }

      // k8s 메타 → Loki 라벨 매핑 (스포크와 동일 라벨 체계)
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_pod_phase"]
          regex         = "Pending|Succeeded|Failed|Completed"
          action        = "drop"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        // app 라벨: 표준 app.kubernetes.io/name 을 먼저 깔고, 우리식 app 라벨이 있으면 덮어씀 (뒤 rule 이 우선)
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          regex         = "(.+)"
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_role"]
          target_label  = "role"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
      }

      // k8s API 경유 tail (kubectl logs 방식 — hostPath 불필요)
      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.write.local.receiver]
      }

      // k8s Event 도 Loki 로 (PolicyViolation·FailedScheduling 등 — 로그가 아니라 이벤트인 기록들)
      loki.source.kubernetes_events "events" {
        forward_to = [loki.write.local.receiver]
      }

      // 같은 클러스터라 gateway 서비스로 직접 (NLB 경유 불필요)
      loki.write "local" {
        endpoint {
          url = "http://loki-gateway.monitoring.svc/loki/api/v1/push"
        }
        external_labels = {
          cluster = "demo-hub-01",
        }
      }
