# E1 — Grafana Alloy (스포크 로그 수집 DaemonSet) → 허브 Loki (내부 NLB loki.eks.example.com).
# fluent-bit 에서 교체(2026-09-27 운영 결정) — Grafana 공식 수집기(promtail 후계), 추후 메트릭·트레이스 통합 여지.
# 수집 방식 = loki.source.kubernetes (k8s API 로 tail, hostPath 마운트 불필요) — 노드별로 자기 노드 파드만(NODE_NAME 셀렉터).
# 라벨 설계(카디널리티 절제): cluster·namespace·app·container·role 만 — fluent-bit 때와 동일 (LOGQL-CHEATSHEET 호환).
# ⚠️ fluent-bit 와 차이: 로그 줄이 JSON 래핑 없이 원문 그대로 (| json 은 앱이 JSON 찍을 때만 필요)
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: alloy
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            demo.io/workload: "true"
  template:
    metadata:
      name: "alloy-{{.name}}"
      annotations:
        argocd.argoproj.io/sync-wave: "2"
    spec:
      project: spoke
      source:
        repoURL: https://grafana.github.io/helm-charts
        chart: alloy
        targetRevision: 1.11.1 # app v1.18.1 — 최신(1.13.x)에서 2마이너 뒤 (업그레이드 연습용)
        helm:
          valuesObject:
            controller:
              type: daemonset
              # 전 노드 수집 — tainted 풀(env=prod/nonprod)에도 떠야 하므로 전체 tolerate
              tolerations:
                - operator: Exists
            alloy:
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { memory: 256Mi }
              extraEnv:
                - name: NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
              configMap:
                content: |
                  // 자기 노드의 파드만 발견 (DaemonSet 1대당 1노드 담당)
                  discovery.kubernetes "pods" {
                    role = "pod"
                    selectors {
                      role  = "pod"
                      field = "spec.nodeName=" + sys.env("NODE_NAME")
                    }
                  }

                  // k8s 메타 → Loki 라벨 매핑 (기존 fluent-bit 라벨 체계 유지)
                  discovery.relabel "pods" {
                    targets = discovery.kubernetes.pods.targets
                    rule {
                      source_labels = ["__meta_kubernetes_pod_phase"]
                      regex         = "Pending|Succeeded|Failed|Completed"
                      action        = "drop"
                    }
                    rule {
                      source_labels = ["__meta_kubernetes_namespace"]
                      target_label  = "namespace"
                    }
                    // app 라벨: 표준 app.kubernetes.io/name 을 먼저 깔고, 우리식 app 라벨이 있으면 덮어씀 (뒤 rule 이 우선)
                    rule {
                      source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
                      target_label  = "app"
                    }
                    rule {
                      source_labels = ["__meta_kubernetes_pod_label_app"]
                      regex         = "(.+)"
                      target_label  = "app"
                    }
                    rule {
                      source_labels = ["__meta_kubernetes_pod_label_role"] // canary/stable (골든차트 canaryMetadata)
                      target_label  = "role"
                    }
                    rule {
                      source_labels = ["__meta_kubernetes_pod_container_name"]
                      target_label  = "container"
                    }
                  }

                  // k8s API 경유 tail (kubectl logs 방식 — hostPath 불필요)
                  loki.source.kubernetes "pods" {
                    targets    = discovery.relabel.pods.output
                    forward_to = [loki.write.hub.receiver]
                  }

                  // k8s Event 도 Loki 로 (PolicyViolation·FailedScheduling 등 — 로그가 아니라 이벤트인 기록들).
                  // 클러스터당 1개면 충분한데 DS 라 노드 수만큼 뜨므로 중복 방지용이 아니라… Alloy 가
                  // 내부적으로 lease 로 1개만 활성화함 (동일 job 여러 인스턴스 안전)
                  loki.source.kubernetes_events "events" {
                    forward_to = [loki.write.hub.receiver]
                  }

                  loki.write "hub" {
                    endpoint {
                      url = "http://loki.eks.example.com/loki/api/v1/push"
                    }
                    external_labels = {
                      cluster = "{{.name}}",
                    }
                  }
      destination:
        server: "{{.server}}"
        namespace: logging
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        automated:
          selfHeal: true
          prune: true
