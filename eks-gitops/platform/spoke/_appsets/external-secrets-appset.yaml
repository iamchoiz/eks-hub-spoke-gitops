apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: external-secrets
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            demo.io/workload: "true"
  template:
    metadata:
      name: "external-secrets-{{.name}}"
      annotations:
        argocd.argoproj.io/sync-wave: "1" # CRD 포함
    spec:
      project: spoke
      source:
        repoURL: https://charts.external-secrets.io
        chart: external-secrets
        targetRevision: 2.11.0 # 1.35 업그레이드 선행 (0.10=k8s≤1.31 EOL, 2.x=1.35). 허브는 step6. ⚠️values 스키마·CRD v1 확인
        helm:
          valuesObject:
            installCRDs: true
            serviceAccount:
              name: external-secrets # 스포크 Pod Identity association 과 이름 일치
      destination:
        server: "{{.server}}"
        namespace: external-secrets
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        automated:
          selfHeal: true
          prune: true
