apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cert-manager
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            demo.io/workload: "true"
  template:
    metadata:
      name: "cert-manager-{{.name}}"
      annotations:
        argocd.argoproj.io/sync-wave: "1" # CRD 포함
    spec:
      project: spoke
      source:
        repoURL: https://charts.jetstack.io
        chart: cert-manager
        targetRevision: v1.21.2 # 1.35 업그레이드 선행 (v1.16=k8s≤1.32, v1.21=1.33~1.36). 허브는 step6 에서 승급
        helm:
          valuesObject:
            crds:
              enabled: true
      destination:
        server: "{{.server}}"
        namespace: cert-manager
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        automated:
          selfHeal: true
          prune: true
