apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: keda
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            demo.io/workload: "true"
  template:
    metadata:
      name: "keda-{{.name}}"
      annotations:
        argocd.argoproj.io/sync-wave: "1" # CRD 포함
    spec:
      project: spoke
      source:
        repoURL: https://kedacore.github.io/charts
        chart: keda
        targetRevision: 2.21.0 # 1.35 업그레이드 선행 (2.17=k8s≤1.32, 2.21=1.34~1.36). green fresh 설치
        helm:
          valuesObject:
            resources:
              operator:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { memory: 256Mi }
      destination:
        server: "{{.server}}"
        namespace: keda
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true # CRD 커서 client-side annotation 제한 회피
        automated:
          selfHeal: true
          prune: true
