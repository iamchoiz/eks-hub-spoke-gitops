apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: external-dns
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            demo.io/workload: "true"
  template:
    metadata:
      name: "external-dns-{{.name}}"
      annotations:
        argocd.argoproj.io/sync-wave: "2"
    spec:
      project: spoke
      source:
        repoURL: https://kubernetes-sigs.github.io/external-dns/
        chart: external-dns
        targetRevision: 1.15.2 # 허브와 동일
        helm:
          valuesObject:
            provider:
              name: aws
            policy: upsert-only # 삭제 안 함 (안전)
            domainFilters:
              - eks.example.com # 허브와 공유하는 전용 서브도메인
            txtOwnerId: "{{.name}}" # 스포크 이름 자동 주입 — 허브(demo-hub-01)와 owner 겹치면 레코드 뺏김
            sources:
              - ingress
              - service
            serviceAccount:
              name: external-dns # 스포크 Pod Identity association 과 일치
      destination:
        server: "{{.server}}"
        namespace: external-dns
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
        automated:
          selfHeal: true
          prune: true
