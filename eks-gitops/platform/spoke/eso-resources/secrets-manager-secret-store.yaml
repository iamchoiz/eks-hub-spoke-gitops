apiVersion: external-secrets.io/v1 # ESO 2.x (green) — v1beta1 미지원. 허브 등록/허브 ES 는 step6 까지 v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2
      # auth 블록 없음 = ESO 컨트롤러 파드의 Pod Identity 사용 (허브와 동일 패턴).
      # IAM: <클러스터>-external-secrets role (Pod Identity association 은 클러스터별 TF 로 존재).
      # 앱 시크릿 흐름: SM 에 값 저장 → 서비스 폴더의 ExternalSecret 이 이 store 를 참조 → k8s Secret 동기화.
